<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazing Zone</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }

    .topbar {
      background-color: #131921;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }

    .header-link {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    .header-link:hover {
      color: #ffc107;
    }

    .sidebar-card,
    .products-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .product-card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease;
      height: 100%;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-image {
      height: 180px;
      object-fit: cover;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      width: 50%;
      margin: 0 auto;
      display :block;
    }

    .search-input {
      min-width: 260px;
    }

    @media (max-width: 991px) {
      .search-input {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <body>
<div id="app">

  <nav class="navbar navbar-expand-lg topbar py-3">
    <div class="container-fluid px-4">
      <a class="brand me-4" href="index.html">Amazing Zone</a>

      <div class="collapse navbar-collapse">
        <div class="d-flex align-items-center gap-4 ms-auto">
          <a href="index.html" class="header-link">
            <i class="bi bi-house-door me-1"></i> Home
          </a>

          <a href="cart.html" class="header-link">
            <i class="bi bi-cart3 me-1"></i> Cart
          </a>

            <a @click="logout" href="login.html" class="header-link">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-5">

    <div class="card p-4 mx-auto profile-card">

      <h3 class="mb-4 text-center">Edit Profile</h3>

      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Name</label>
          <input v-model="name" type="text" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">Prenom</label>
          <input v-model="familyName" type="text" class="form-control">
        </div>

        <div class="col-12">
          <label class="form-label">Email</label>
          <input v-model="email" type="email" class="form-control">
        </div>

        <div class="col-12">
          <label class="form-label">Adresse</label>
          <input v-model="adresse" type="text" class="form-control">
        </div>

        <div class="col-12">
          <label class="form-label">Password</label>
          <input v-model="password" type="password" class="form-control">
        </div>

      </div>

      <div class="d-flex justify-content-between mt-4">

        <button class="btn btn-light border px-4" @click="cancel">
          Cancel
        </button>

        <button class="btn btn-warning px-4" @click="update">
          Save
        </button>

      </div>

    </div>

  </div>

</div>
<script>
  new Vue({
    el: '#app',
    data: {
      name: '',
      familyName: '',
      email: '',
      adresse: '',
      password: ''
    },
    methods: {
      cancel() {
        this.name = '';
        this.familyName = '';
        this.email = '';
        this.adresse = '';
        this.password = '';

        
      },
      logout() {
        localStorage.removeItem("connected");
        localStorage.removeItem("userId");
        window.location.href = "login.html";
      },
     
      
      update(){
        const id = localStorage.getItem("userId");
        fetch(`http://localhost:3000/updateuser/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name: this.email,
            familyname: this.familyName,
            email: this.email,
            adresse: this.adresse,
            password: this.password,
            id: id
        


            

            
          })
        })
        .then(res => res.json())
        .then(data => {
          console.log(data);

          if (data.success) {
            

            
            alert(data.message || 'Profile updated successfully');            
          } else {
            alert(data.message);
          }
        })
        .catch(err => console.log(err));


      }
    }
  });
</script>
</body>
</html>
