<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Amazing Zone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <style>
    body { background:#f5f6f8; min-height:100vh; }
    .topbar { background:#131921; }
    .brand { color:#fff; text-decoration:none; font-weight:700; font-size:1.4rem; }
    .header-link { color:#fff; text-decoration:none; font-weight:500; }
    .header-link:hover { color:#ffc107; }
    .wrap { min-height:calc(100vh - 80px); }
    .card-auth { max-width:480px; width:100%; border:none; border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
    .form-control { border-radius:10px; padding:.8rem .95rem; }
    .btn-main { border-radius:10px; padding:.8rem; font-weight:600; }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar navbar-expand-lg topbar py-3">
      <div class="container-fluid px-4">
        <a class="brand" href="index.html">Amazing Zone</a>
        <div class="d-flex align-items-center gap-4 ms-auto">
          <a href="index.html" class="header-link"><i class="bi bi-house-door me-1"></i> Home</a>
          <a href="login.html" class="header-link"><i class="bi bi-box-arrow-in-right me-1"></i> Login</a>
        </div>
      </div>
    </nav>

    <div class="container wrap d-flex justify-content-center align-items-center py-5">
      <div class="card card-auth p-4 p-md-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold mb-2">Create account</h2>
          <p class="text-muted mb-0">Join Amazing Zone</p>
        </div>

        <form @submit.prevent="signUp">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="firstName" class="form-label">Name</label>
              <input v-model="nom" type="text" id="firstName" class="form-control" placeholder="Your name" required>
            </div>
            <div class="col-md-6">
              <label for="lastName" class="form-label">Family name</label>
              <input v-model="prenom" type="text" id="lastName" class="form-control" placeholder="Your family name" required>
            </div>
          </div>

          <div class="mt-3">
            <label for="email" class="form-label">Email</label>
            <input v-model="email" type="email" id="email" class="form-control" placeholder="Enter your email" required>
          </div>

          <div class="mt-3">
            <label for="password" class="form-label">Password</label>
            <input v-model="password" type="password" id="password" class="form-control" placeholder="Create a password" required>
          </div>

          <div class="mt-3">
            <label for="adresse" class="form-label">Address</label>
            <input v-model="adresse" type="text" id="adresse" class="form-control" placeholder="Enter your address" required>
          </div>

          <button type="submit" class="btn btn-warning w-100 btn-main mt-4">Sign Up
      
          </button>

          <p class="text-center mt-3 mb-0 text-muted">
            Already have an account?
            <a href="login.html" class="text-decoration-none fw-semibold">Login</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script>
    new Vue({
      el: '#app',
      data: {
        nom: '',
        prenom: '',
        email: '',
        password: '',
        adresse: ''
      },
      methods: {
        signUp() {
          fetch('https://amazingzone.onrender.com//adduser', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              name: this.nom,
              family_name: this.prenom,
              email: this.email,
              password: this.password,
              adresse: this.adresse
            })
          })
          .then(response => response.json())
          .then(data => {
            console.log(data);
            alert(data.message || 'User created successfully');

            this.nom = '';
            this.prenom = '';
            this.email = '';
            this.password = '';
            this.adresse = '';
          })
          .catch(error => {
            console.error('Error:', error);
            alert('Error while creating account');
          });
          window.location.href = 'login.html';

        }
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
