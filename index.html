<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazing Zone</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }

    .topbar {
      background-color: #131921;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }

    .header-link {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    .header-link:hover {
      color: #ffc107;
    }

    .sidebar-card,
    .products-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .product-card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease;
      height: 100%;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-image {
      height: 180px;
      object-fit: cover;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      width: 50%;
      margin: 0 auto;
      display :block;
    }

    .search-input {
      min-width: 260px;
    }

    @media (max-width: 991px) {
      .search-input {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar navbar-expand-lg topbar py-3">
      <div class="container-fluid px-4">
        <a class="brand me-4" href="index.html">Amazing Zone</a>

        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
          <form class="d-flex flex-grow-1 my-3 my-lg-0 me-lg-4" @submit.prevent>
            <input
              class="form-control search-input me-2"
              type="search"
              placeholder="Search products..."
              v-model="search"
            >
            <button class="btn btn-warning" type="submit">
              <i class="bi bi-search"></i>
            </button>
          </form>

          <div class="d-flex align-items-center gap-4">
            <a v-if="!Connected" href="login.html" class="header-link"><i class="bi bi-person-circle me-1"></i> Login</a>
            <a v-if="Connected" href="profile.html" class="header-link"><i class="bi bi-person-circle me-1"></i> Profile</a>
            <a v-if="Connected" class="header-link" @click="logout()">
              <i class="bi bi-box-arrow-right me-1"></i> Logout
            </a>
            <a href="cart.html" class="header-link"><i class="bi bi-cart3 me-1"></i> Cart({{totalitems}})</a>
          </div>
        </div>
      </div>
    </nav>

    <div class="container-fluid py-4 px-4">
      <div class="row g-4">
        <div class="col-lg-3">
          <div class="card sidebar-card p-3">
            <h5 class="mb-3">Categories</h5>
            <label for="categorySelect" class="form-label">Choose a category</label>
            <select id="categorySelect" class="form-select" v-model="selectedCategory">
              <option value="All products">All products</option>
              <option value="Health And Beauty">Health And Beauty</option>
              <option value="Baby">Baby</option>
              <option value="Electronics">Electronics</option>
              
              <option value="Home">Home</option>
              <option value="Sports">Sports</option>
              <option value="Books">Books</option>
            </select>
          </div>
        </div>

        <div class="col-lg-9">
          <div class="card products-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
              <h4 class="mb-0">Products</h4>
              <span class="text-muted">{{ filteredProducts.length }} product(s)</span>
            </div>

            <div class="row g-4">
              <div
                class="col-md-6 col-xl-4"
                v-for="product in filteredProducts"
                :key="product.id_product" 
              >

                <div class="card product-card">
                  <a :href="'product.html?id=' + product.id_product">
                    <img
                      :src="'http://localhost:3000/images/' + product.image"
                      class="product-image"
                      :alt="product.nom"
                    >
                  </a>

                  <div class="card-body">
                    <h5 class="card-title">{{ product.nom }}</h5>
                    <p class="card-text text-muted">{{ product.description }}</p>

                    <div class="d-flex justify-content-between align-items-center">
                      <strong>${{ Number(product.prix).toFixed(2) }}</strong>
                      <button class="btn btn-dark btn-sm" @click="addToCart(product)">
                        Add to cart
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div v-if="filteredProducts.length === 0" class="col-12">
                <div class="alert alert-warning mb-0">
                  No products found.
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
new Vue({
  el: "#app",

  data: {
    products: [],
    search: "",
    selectedCategory: "All products",
    Connected: false,
    cart: [],
    totalitems: 0
  },

  computed: {
    filteredProducts() {
      return this.products.filter(product => {
        const matchesCategory =
          this.selectedCategory === "All products" ||
          product.category === this.selectedCategory;

        const matchesSearch =
          product.nom.toLowerCase().includes(this.search.toLowerCase()) ||
          product.description.toLowerCase().includes(this.search.toLowerCase());

        return matchesCategory && matchesSearch;
      });
    }
  },

  methods: {
    loadProducts() {
      fetch("http://localhost:3000/products")
        .then(res => res.json())
        .then(data => {
          this.products = data;
        })
        .catch(err => console.log(err));
    },

    updateCartCount() {
      this.totalitems = this.cart.reduce((sum, item) => {
        return sum + Number(item.quantity);
      }, 0);
    },

    addToCart(product) {
      const existingIndex = this.cart.findIndex(
        item => item.id === product.id_product
      );

      if (existingIndex !== -1) {
        this.cart[existingIndex].quantity += 1;
      } else {
        this.cart.push({
          id: product.id_product,
          nom: product.nom,
          prix: product.prix,
          image: product.image,
          quantity: 1
        });
      }

      localStorage.setItem("cart", JSON.stringify(this.cart));
      this.updateCartCount();
    },

    logout() {
      localStorage.removeItem("connected");
      this.Connected = false;
      window.location.href = "index.html";
    }
  },

  mounted() {
    this.loadProducts();

    this.cart = JSON.parse(localStorage.getItem("cart")) || [];
    this.updateCartCount();

    this.Connected = localStorage.getItem("connected") === "true";
  }
});
</script>
</body>
</html>
