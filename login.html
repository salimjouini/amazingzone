<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - MyStore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
   body {
      background: #f5f6f8;
      min-height: 100vh;
    }

    .topbar {
      background-color: #131921;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }

    .header-link {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    .header-link:hover {
      color: #ffc107;
    }

    .login-wrapper {
      min-height: calc(100vh - 80px);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      border: none;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .form-control {
      border-radius: 10px;
      padding: 0.8rem 0.95rem;
    }

    .btn-login {
      border-radius: 10px;
      padding: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar navbar-expand-lg topbar py-3">
      <div class="container-fluid px-4">
        <a class="brand" href="index.html">Amazing Zone</a>

        <div class="d-flex align-items-center gap-4 ms-auto">
          <a href="index.html" class="header-link"><i class="bi bi-house-door me-1"></i> Home</a>
          <a href="signup.html" class="header-link"><i class="bi bi-person-plus me-1"></i> Sign Up</a>
        </div>
      </div>
    </nav>

    <div class="container login-wrapper d-flex justify-content-center align-items-center py-5">
      <div class="card login-card p-4 p-md-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold mb-2">Login</h2>
          <p class="text-muted mb-0">Shop with us</p>
        </div>

        <form @submit.prevent="login">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input v-model="email" type="email" class="form-control" id="email" placeholder="Enter your email">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input v-model="password" type="password" class="form-control" id="password" placeholder="Enter your password">
          </div>

          <button type="submit"  class="btn btn-warning w-100 btn-login mb-3">Login</button>

          <p class="text-center mb-0 text-muted">
            Don't have an account?
            <a href="signup.html" class="text-decoration-none fw-semibold">Sign up</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script>
  new Vue({
    el: '#app',
    data: {
      email: '',
      password: '',
    
    },
    methods: {
      login() {
        fetch("http://localhost:3000/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: this.email,
            password: this.password
            

            
          })
        })
        .then(res => res.json())
        .then(data => {
          console.log(data);

          if (data.success) {
            
            localStorage.setItem("userId", data.id);
            
            console.log(data.id);
            localStorage.setItem("connected", "true");
            window.location.href = "index.html";
          } else {
            alert(data.message);
          }
        })
        .catch(err => console.log(err));
      }
    }
  });
</script>
</body>
</html>
